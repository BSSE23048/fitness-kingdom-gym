name: Owner access checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  rules-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:rules:ci
      - run: npm run build
